<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#f4f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* =========================
   DASHBOARD
========================= */

.dashboard{
    width:92%;
    max-width:1000px;
    height:90vh;
    background:white;
    border:1px solid #d9e1ec;
    border-radius:28px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    overflow:hidden;
}


/* =========================
   TOP BAR
========================= */

.header{
    width:100%;
    height:65px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#243b64;
}

.profile{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#243b64;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    cursor:pointer;
}


/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.card{
    height:220px;
    border-radius:22px;
    padding:25px;
    border:1px solid #e0e6ef;
    background:white;
    box-shadow:0 7px 20px rgba(0,0,0,0.07);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 30px rgba(0,0,0,0.12);
}


/* Icon */

.card-icon{
    width:70px;
    height:70px;
    border-radius:18px;
    background:#edf3ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    margin-bottom:18px;
}


/* Title */

.card h2{
    color:#243b64;
    font-size:22px;
    text-align:center;
}


/* =========================
   PROFILE POPUP
========================= */

.profile-popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);

    align-items:center;
    justify-content:center;

    z-index:1000;
    padding:20px;
}

.profile-box{
    width:90%;
    max-width:450px;
    background:white;
    border-radius:25px;
    padding:30px;
    position:relative;

    box-shadow:0 20px 50px rgba(0,0,0,0.2);

    animation:popup .25s ease;
}

@keyframes popup{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.close{
    position:absolute;
    right:20px;
    top:12px;

    font-size:28px;
    color:#777;

    cursor:pointer;
}

.profile-photo{
    width:85px;
    height:85px;

    border-radius:50%;

    background:#edf3ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    margin:5px auto 15px;
}

.profile-box h2{
    text-align:center;
    color:#243b64;
    margin-bottom:5px;
}

.student-id{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:22px;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.detail{
    background:#f6f8fc;
    padding:12px;
    border-radius:12px;
}

.detail label{
    display:block;
    color:#888;
    font-size:11px;
    margin-bottom:5px;
}

.detail span{
    color:#243b64;
    font-size:13px;
    font-weight:bold;
}

.edit-btn{
    width:100%;
    margin-top:20px;
    padding:13px;

    border:none;
    border-radius:12px;

    background:#243b64;
    color:white;

    font-size:15px;
    cursor:pointer;
}


/* =========================
   MOBILE VIEW
========================= */

@media(max-width:700px){

    body{
        width:100%;
        height:100%;
        overflow:hidden;
    }

    body{

    .card{

    .card:hover{

}

function closeProfile(){

    document.getElementById("profilePopup").style.display = "none";

}

window.onclick = function(event){

    const popup =

};

});
