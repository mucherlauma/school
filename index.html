<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Login</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}html,body{width:100%;min-height:100%}body{background:#eaf2ff;color:#183b70}.school-page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}.school-top{height:38vh;width:100%;min-height:250px;background:#eaf2ff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px 45px}.school-logo{width:85px;height:85px;object-fit:contain;margin-bottom:18px}.school-name{font-size:24px;font-weight:800;letter-spacing:-.6px;font-family:Georgia,serif;color:#183b70}.school-subtitle{font-size:12px;color:#7891b1;margin-top:9px}.login-section{flex:1;position:relative;background:white;border-radius:48px 48px 0 0;margin-top:-25px;padding:45px 24px 35px;display:flex;flex-direction:column;align-items:center}.login-content{width:100%;max-width:380px}.login-title{font-size:24px;font-weight:800;color:#183b70;text-align:center;font-family:'Figtree',sans-serif}.login-subtitle{font-size:13px;color:#98a2b3;text-align:center;margin-top:9px;margin-bottom:35px;font-family:'Figtree',sans-serif}.form-group{margin-bottom:22px}.form-group label{display:block;font-size:12px;font-weight:600;color:#344054;margin-bottom:10px}.input-box{display:flex;align-items:center;width:100%;height:53px;padding:0 15px;border:1px solid #dfe5ed;border-radius:12px;background:#fff;transition:.2s}.input-box:focus-within{border-color:#285b9e}.input-box input{width:100%;height:100%;border:none;outline:none;background:transparent;font-size:13px;color:#1d2939}.input-box input::placeholder{color:#a3adba}.country-code{font-size:13px;font-weight:600;color:#344054;padding-right:12px;margin-right:12px;border-right:1px solid #dfe5ed}.show-btn{border:none;background:none;font-size:11px;font-weight:700;color:#285b9e;cursor:pointer;padding:8px}.login-btn{width:100%;height:53px;background:#183b70;border:none;border-radius:12px;color:white;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s}.login-btn:hover{background:#285b9e}.error{display:none;margin-top:15px;text-align:center;font-size:12px;color:#d92d42}.footer{margin-top:auto;padding-top:45px;font-size:11px;color:#a0aaba;text-align:center}@media(min-width:768px){.school-top{height:40vh}.login-section{border-radius:65px 65px 0 0;padding-top:55px}}@media(max-width:480px){.school-top{height:35vh;min-height:240px}.school-logo{width:75px;height:75px}.school-name{font-size:27px}.login-section{border-radius:42px 42px 0 0;padding:42px 25px 30px}.login-title{font-size:23px}}
</style></head><body><div class="school-page"><div class="school-top"><img src="logo.png" class="school-logo" alt="School Logo"><h1 class="school-name">CEZONAL</h1><p class="school-subtitle">School Management Portal</p></div><section class="login-section"><div class="login-content"><h2 class="login-title">Welcome Back</h2><p class="login-subtitle">Login to your account</p><form id="loginForm"><div class="form-group"><label for="mobile">Mobile Number</label><div class="input-box"><span class="country-code">+91</span><input type="tel" id="mobile" placeholder="Enter mobile number" maxlength="10" pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel-national" required></div></div><div class="form-group"><label for="password">Password</label><div class="input-box"><input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required><button type="button" class="show-btn" id="toggleBtn" onclick="togglePassword()">SHOW</button></div></div><button type="submit" class="login-btn">Login</button><p class="error" id="error" role="alert"></p></form></div><p class="footer">© 2026 Your School Name</p></section></div><script>
function togglePassword(){const input=document.getElementById('password');const btn=document.getElementById('toggleBtn');input.type=input.type==='password'?'text':'password';btn.textContent=input.type==='password'?'SHOW':'HIDE'}
const mobile=document.getElementById('mobile');mobile.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,10)});
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const mobileNumber=mobile.value.trim();const password=document.getElementById('password').value;const error=document.getElementById('error');error.style.display='none';if(!/^[0-9]{10}$/.test(mobileNumber)){error.textContent='Enter a valid mobile number';error.style.display='block';return}if(!password){error.textContent='Enter your password';error.style.display='block';return}if(mobileNumber==='9502877675'&&password==='123456'){sessionStorage.setItem('cezonalDemoLogin','true');window.location.href='student-dashboard.html';return}error.textContent='Invalid mobile number or password';error.style.display='block'});
</script></body></html>
